<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog Post Card</title>
  <link rel="stylesheet" href="4styles.css">
</head>
<body>

  <div class="blog-post-card">
    <img
      class="post-img"
      src="https://cdn.freecodecamp.org/curriculum/labs/cover-photo.jpg"
      alt="Cover photo for a blog post">

    <div class="post-content">
      <h2 class="post-title">Getting Started with Web Development</h2>

      <p class="post-excerpt">
        Learn the fundamentals of HTML, CSS, and responsive design to create
        beautiful and modern websites from scratch.
      </p>

      <a href="#" class="read-more">Read More</a>
    </div>
  </div>

</body>
</html>
