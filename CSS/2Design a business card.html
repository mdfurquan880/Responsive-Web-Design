<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Business Card</title>
  <link rel="stylesheet" href="2styles.css">
</head>
<body>
  <div class="business-card">
    <img
      class="profile-image"
      src="https://cdn.freecodecamp.org/curriculum/labs/flower.jpg"
      alt="Profile picture showing a flower"
    >

    <p class="full-name">Mohammad Furquan</p>
    <p class="designation">Frontend Developer</p>
    <p class="company">Tech Solutions Ltd.</p>

    <hr>

    <p>furquan@example.com</p>
    <p>+91 9876543210</p>

    <a class="portfolio-link" href="https://www.freecodecamp.org">
      Portfolio
    </a>

    <hr>

    <div class="social-media">
      <h2>Connect with me</h2>

      <a href="https://twitter.com">Twitter</a><br>
      <a href="https://linkedin.com">LinkedIn</a><br>
      <a href="https://github.com">GitHub</a>
    </div>
  </div>
</body>
</html>
