<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Product Landing Page</title>
    <link rel="stylesheet" href="35styles.css">
  </head>

<body>
  <header id="header">
    <img id="header-img" src="https://img.freepik.com/free-vector/bird-colorful-logo-gradient-vector_343694-1365.jpg?semt=ais_hybrid&w=740&q=80" width="150px" height="150px" alt="My Brand Logo" />
    <nav id="nav-bar">
      <a href="#features" class="nav-link">Features</a>
      <a href="#pricing" class="nav-link">Pricing</a>
      <a href="#contact" class="nav-link">contact</a>
      
    </nav>
  </header>
  <main>
  <section id="features">
    <h2>Awesome Features</h2>
    <p>Highlight what makes your product unique and valuable.</p>
  </section>
  <section id="pricing">
    <h2>Pricing</h2>
    <p>Show different plans or offers here.</p>
    <div class="pricing-containers">
      <div class="price-card">Basic Plan</div>
      <div class="price-card">Pro Plan</div>
      <div class="price -card">Enterprise</div>
    </div>
  </section>
  <section id="video-section">
    <h2>Watch Our Demo</h2>
    <video id="video" width="560" height="315" src="https://www.youtube.com/embed/VIDEO_ID" frameborder="0" allowfullscreen></video>
  </section>
  <section id="contact">
    <h2>Stay Updated</h2>
    <form id="form" action="https://www.freecodecamp.org/email-submit">
    <input type="email" id="email" name="email" placeholder="Enter your email" required />
    <input type="submit" id="submit" value="Subscribe" />
    </form>
  </section>
  </main>
  <footer>
    <p>© 2026 My Product Landing Page</p>
  </footer>

</body>

</html>
