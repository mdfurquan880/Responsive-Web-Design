<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Newspaper Layout</title>
  <link rel="stylesheet" href="34styles.css">
</head>
<body>

  <main class="newspaper-layout">

    <header class="title">
      <h1>The Daily News</h1>
    </header>

    <article class="feature-article">
      <h2>Main Story</h2>
      <p>This is the main feature article content.</p>
    </article>

    <article class="secondary-article">
      <h2>Secondary Story</h2>
      <p>This is the secondary article content.</p>
    </article>

    <figure class="cover-image">
      <img
        src="https://cdn.freecodecamp.org/curriculum/css-grid/newspaper.jpg"
        alt="Newspaper cover"
      >
    </figure>

    <article class="small-article1">
      <h3>Article One</h3>
      <p>Content for article one.</p>
    </article>

    <article class="small-article2">
      <h3>Article Two</h3>
      <p>Content for article two.</p>
    </article>

    <article class="small-article3">
      <h3>Article Three</h3>
      <p>Content for article three.</p>
    </article>

  </main>

</body>
</html>
