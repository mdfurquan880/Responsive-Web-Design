<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List</title>
  <link rel="stylesheet" href="3styles.css">
</head>
<body>

  <ul class="todo-list">
    <li>
      <input type="checkbox" id="task1">
      <label for="task1">Learn HTML</label>

      <ul class="sub-item">
        <li>
          <a class="sub-item-link" href="https://www.freecodecamp.org" target="_blank">
            HTML Resources
          </a>
        </li>
      </ul>
    </li>

    <li>
      <input type="checkbox" id="task2">
      <label for="task2">Learn CSS</label>

      <ul class="sub-item">
        <li>
          <a class="sub-item-link" href="https://developer.mozilla.org" target="_blank">
            CSS Guide
          </a>
        </li>
      </ul>
    </li>

    <li>
      <input type="checkbox" id="task3">
      <label for="task3">Learn JavaScript</label>

      <ul class="sub-item">
        <li>
          <a class="sub-item-link" href="https://javascript.info" target="_blank">
            JavaScript Tutorial
          </a>
        </li>
      </ul>
    </li>

    <li>
      <input type="checkbox" id="task4">
      <label for="task4">Build Projects</label>

      <ul class="sub-item">
        <li>
          <a class="sub-item-link" href="https://github.com" target="_blank">
            Project Ideas
          </a>
        </li>
      </ul>
    </li>
  </ul>

</body>
</html>
