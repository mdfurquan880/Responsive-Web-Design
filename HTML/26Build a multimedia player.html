<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multimedia Player</title>
</head>

<body>
  <h1>Multimedia Player</h1>

<section>
  <h2>Sailing Away</h2>

  <audio controls aria-label="Audio player for Sailing Away">
    <source
      src="https://cdn.freecodecamp.org/curriculum/js-music-player/sailing-away.mp3"
      type="audio/mpeg"
    >
  </audio>
</section>

<section>
  <h2>What Is the Map Method and How Does It Work?</h2>

  <video controls width="600" aria-label="Video about the JavaScript map method">
    <source
      src="https://cdn.freecodecamp.org/curriculum/labs/what-is-the-map-method-and-how-does-it-work.mp4"
      type="video/mp4"
    >

    <track
      src="https://cdn.freecodecamp.org/curriculum/labs/what-is-the-map-method-and-how-does-it-work.vtt"
      kind="subtitles"
      srclang="en"
      label="English"
    >
  </video>
</section>

<section>
  <h2>Transcript</h2>

  <p>
    This video explains the JavaScript map() method, how it works with arrays,
    and how developers can use it to transform data efficiently while returning
    a new array.
  </p>
</section>

</body>

</html>
