<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Survey Form</title>
  </head>

  <body>
    <h1 id="title">freeCodeCamp Survey Form</h1>

    <p id="description">Thank you for taking the time to help us improve the platform</p>

    <form id="survey-form">

      <!-- Name field -->
      <label for="name" id="name-label">Name:</label>
      <input type="text" id="name" placeholder="Enter your Name" name="name" required>

      <!-- Email field -->
      <label for="email" id="email-label">Email:</label>
      <input type="email" id="email" name="email" placeholder="Enter Your Email" required>

      <!-- Age field -->
      <label for="number" id="number-label">Age (optional):</label>
      <input type="number" id="number" name="age" placeholder="Age" min="10" max="90" required>

      <!-- Dropdown --> 
      <label for="dropdown">Which option best describes you?</label>
      <select id="dropdown" name="role"> 
      <option value="student">Student</option> <option value="professional">Professional</option> 
      <option value="full-time">Full Time</option>
      <option value="part-time">Part Time</option>
      </select>

      <!-- Radio Buttons --> 
      <p>Would you recommend us?</p> 
      <label>
        <input type="radio" name="recommend" value="yes"> Yes</label> 
      <label>
        <input type="radio" name="recommend" value="no"> No</label>

      <!-- Checkboxes --> 
      <p>What services do you use?</p> 
      <label>
        <input type="checkbox" name="services" value="web"> Web Development</label> 
      <label>
        <input type="checkbox" name="services" value="data"> Data Analysis</label> 
      <label>
        <input type="checkbox" name="services" value="design"> Design</label>

      <!-- Textarea --> 
      <label for="comments">Additional Comments:</label> 
      <textarea id="comments" name="comments" placeholder="Enter your comments here..."></textarea>

      <!-- Submit Button --> 
      <button id="submit" type="submit">Submit</button>

    </form>
  </body>
</html>
